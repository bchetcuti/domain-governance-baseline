<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Domain Governance Baseline</title>
  <desc id="desc">A practical guide and reflection tool by Bryan Chetcuti for domain governance and digital trust.</desc>

  <defs>
    <style>
      .bg { fill: #f6f5f1; }
      .panel { fill: #fbfaf7; stroke: #d0ccc2; stroke-width: 2; }
      .primary { fill: #0d5b5f; }
      .primary-stroke { stroke: #0d5b5f; }
      .muted { fill: #5f645f; }
      .text { fill: #1c2321; }
      .rule { stroke: #d0ccc2; stroke-width: 2; }
      .soft { fill: #dceae9; }
      .title-text {
        font-family: "Poppins", "Inter", "Segoe UI", Arial, sans-serif;
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -1.8px;
      }
      .subtitle-text {
        font-family: "Poppins", "Inter", "Segoe UI", Arial, sans-serif;
        font-size: 28px;
        font-weight: 500;
      }
      .body-text {
        font-family: "Poppins", "Inter", "Segoe UI", Arial, sans-serif;
        font-size: 30px;
        font-weight: 500;
      }
      .small-text {
        font-family: "Poppins", "Inter", "Segoe UI", Arial, sans-serif;
        font-size: 22px;
        font-weight: 500;
      }
      .footer-text {
        font-family: "Poppins", "Inter", "Segoe UI", Arial, sans-serif;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <rect class="bg" width="1200" height="630"/>

  <rect x="64" y="64" width="1072" height="502" rx="34" class="panel"/>

  <!-- Brand mark -->
  <g transform="translate(104 104)">
    <circle cx="42" cy="42" r="38" fill="none" stroke="#0d5b5f" stroke-width="7"/>
    <path d="M42 4v76M4 42h76" stroke="#0d5b5f" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
    <circle cx="42" cy="42" r="13" fill="#0d5b5f"/>
  </g>

  <!-- Brand line -->
  <text x="206" y="126" class="small-text primary">by Bryan Chetcuti · domain governance and digital trust</text>
  <line x1="206" y1="154" x2="1090" y2="154" class="rule"/>

  <!-- Main title -->
  <text x="104" y="252" class="title-text text">Domain Governance</text>
  <text x="104" y="334" class="title-text text">Baseline</text>

  <!-- Supporting copy -->
  <text x="104" y="404" class="subtitle-text muted">A practical guide and reflection tool for asking:</text>

  <g transform="translate(104 452)">
    <circle cx="12" cy="12" r="8" class="primary"/>
    <text x="36" y="22" class="body-text text">What do we own?</text>

    <circle cx="326" cy="12" r="8" class="primary"/>
    <text x="350" y="22" class="body-text text">Who's accountable?</text>

    <circle cx="676" cy="12" r="8" class="primary"/>
    <text x="700" y="22" class="body-text text">What can be seen?</text>
  </g>

  <!-- Footer strap -->
  <g transform="translate(104 526)">
    <rect x="0" y="-31" width="408" height="48" rx="24" class="soft"/>
    <text x="24" y="0" class="footer-text primary">No score · no data stored</text>
  </g>

  <text x="104" y="603" class="footer-text muted">baseline.bryanchetcuti.com</text>
</svg>
